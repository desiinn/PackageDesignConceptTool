<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パッケージデザインコンセプトシート作成ツール</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>パッケージデザインコンセプトシート作成ツール</h1>
            <p>食品パッケージのデザインイメージを可視化し、共有しましょう</p>
        </div>
        
        <div class="content">
            <!-- Step 0: 製品名入力 -->
            <div class="section">
                <div class="section-title">
                    <span class="step-number">0</span>
                    製品名
                </div>
                <div class="input-group">
                    <label for="productName">製品名を入力してください</label>
                    <input type="text" id="productName" placeholder="例：北海道産小麦使用 プレミアムパン">
                </div>
            </div>
            
            <!-- Step 0.5: ターゲット属性選択 -->
            <div class="section">
                <div class="section-title">
                    <span class="step-number">0.5</span>
                    ターゲット属性
                </div>
                <div class="info-box">
                    <p>想定されるターゲット層を選択してください（1つ選択）</p>
                </div>
                <div class="target-grid" id="targetGrid">
                    <button class="target-btn" data-target="family">
                        <div class="target-name">ファミリー</div>
                        <div class="target-desc">日常・安心</div>
                    </button>
                    <button class="target-btn" data-target="worker">
                        <div class="target-name">働く単身者</div>
                        <div class="target-desc">時短・利便性</div>
                    </button>
                    <button class="target-btn" data-target="senior">
                        <div class="target-name">シニア</div>
                        <div class="target-desc">健康・高品質</div>
                    </button>
                    <button class="target-btn" data-target="reward">
                        <div class="target-name">自分へのご褒美</div>
                        <div class="target-desc">贅沢・トレンド</div>
                    </button>
                    <button class="target-btn" data-target="health">
                        <div class="target-name">健康・美容</div>
                        <div class="target-desc">機能性・自然派</div>
                    </button>
                    <button class="target-btn" data-target="youth">
                        <div class="target-name">若年層</div>
                        <div class="target-desc">低価格・話題性</div>
                    </button>
                    <button class="target-btn" data-target="gift">
                        <div class="target-name">観光・ギフト</div>
                        <div class="target-desc">道外向け・プレミアム</div>
                    </button>
                </div>
            </div>
            
            <!-- Step 1: キーワード選択 -->
            <div class="section">
                <div class="section-title">
                    <span class="step-number">1</span>
                    イメージキーワード選択
                </div>
                <div class="info-box">
                    <p>製品のイメージに近いキーワードを選択してください（複数選択可）</p>
                </div>
                <div class="keywords-grid" id="keywordsGrid">
                    <button class="keyword-btn" data-keyword="luxury">高級感</button>
                    <button class="keyword-btn" data-keyword="elegant">優雅</button>
                    <button class="keyword-btn" data-keyword="modern">モダン</button>
                    <button class="keyword-btn" data-keyword="minimal">洗練された</button>
                    <button class="keyword-btn" data-keyword="natural">ナチュラル</button>
                    <button class="keyword-btn" data-keyword="healthy">健康的</button>
                    <button class="keyword-btn" data-keyword="traditional">伝統的</button>
                    <button class="keyword-btn" data-keyword="retro">レトロ</button>
                    <button class="keyword-btn" data-keyword="cute">かわいい</button>
                    <button class="keyword-btn" data-keyword="simple">シンプル</button>
                    <button class="keyword-btn" data-keyword="rustic">素朴な</button>
                    <button class="keyword-btn" data-keyword="handmade">手作り感</button>
                    <button class="keyword-btn" data-keyword="warm">温かい</button>
                    <button class="keyword-btn" data-keyword="fresh">爽やか</button>
                    <button class="keyword-btn" data-keyword="pop">ポップ</button>
                    <button class="keyword-btn" data-keyword="photo">写真メイン</button>
                </div>
            </div>
            
            <!-- Step 2&3: 画像表示と選択 -->
            <div class="section">
                <div class="section-title">
                    <span class="step-number">2</span>
                    イメージに近い画像を選択
                    <span class="selected-count" id="selectedCount">0/10枚選択</span>
                </div>
                <div class="info-box">
                    <p>イメージに近い画像を5〜10枚選択してください。画像をクリックして選択/解除できます。</p>
                </div>
                <div class="images-grid" id="imagesGrid">
                    <div class="no-images">キーワードを選択すると、関連する画像が表示されます</div>
                </div>
            </div>
            
            <!-- Step 4: 参考製品 -->
            <div class="section">
                <div class="section-title">
                    <span class="step-number">3</span>
                    参考となる既存製品
                </div>
                <div class="input-group">
                    <label for="referenceProducts">参考にしたい既存製品がありましたら記入してください（任意）</label>
                    <textarea id="referenceProducts" placeholder="例：〇〇社の△△という商品のパッケージデザインが参考になります。理由は..."></textarea>
                </div>
            </div>
            
            <!-- Step 5: その他備考 -->
            <div class="section">
                <div class="section-title">
                    <span class="step-number">4</span>
                    その他備考
                </div>
                <div class="input-group">
                    <label for="remarks">その他、デザインに関する要望や補足事項があれば記入してください（任意）</label>
                    <textarea id="remarks" placeholder="例：ターゲット層は30-40代女性です。贈答用としても使えるデザインを希望します。"></textarea>
                </div>
            </div>
            
            <!-- アクションボタン -->
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="generateConceptSheet()">コンセプトシートを生成</button>
                <button class="btn btn-secondary" onclick="resetAll()">すべてリセット</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
